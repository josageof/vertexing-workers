# Constrói e publica as imagens dos workers no Docker Hub (público).
# Roda a cada push que mexe num worker, ou na mão (aba Actions -> Run workflow).
# Precisa de: variável DOCKERHUB_USERNAME e segredo DOCKERHUB_TOKEN no repositório.
name: build-images

on:
  push:
    branches: [main]
    paths: ["trellis2/**", "paint/**", "common/**", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        worker: [trellis2, paint]
    steps:
      - uses: actions/checkout@v4

      - name: Nada de segredos na imagem
        run: |
          if find . -path ./.git -prune -o -name '.env*' -print | grep -q .; then
            echo "::error::arquivo .env no repositório"; exit 1; fi
          if grep -rIEn '(rps_[A-Za-z0-9]{8,}|r8_[A-Za-z0-9]{20,}|user_[A-Za-z0-9]{16,}|hf_[A-Za-z0-9]{30,})' common trellis2 paint; then
            echo "::error::parece haver uma chave no código"; exit 1; fi

      # o runner tem ~14 GB livres; a imagem com CUDA devel passa disso
      - name: Liberar disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.worker }}/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/vertexing-${{ matrix.worker }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/vertexing-${{ matrix.worker }}:${{ github.sha }}
          # reaproveita as camadas da última imagem publicada (rebuild bem mais rápido)
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/vertexing-${{ matrix.worker }}:latest
          cache-to: type=inline
